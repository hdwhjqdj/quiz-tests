<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>互动心理测试合集</title>
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#4a3a5c;--ink2:#5d4a6e;--muted:#a89bb8;--line:#f0e4ec;--rose:#d96b8a;--violet:#8a7bb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(800px 500px at 50% -10%,#fdeaf1 0%,rgba(253,234,241,0) 60%),var(--bg);color:var(--ink2);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
.head{text-align:center;margin-bottom:32px}
.kicker{font-size:11px;letter-spacing:.4em;color:var(--rose);font-weight:800;margin-bottom:10px}
h1{margin:0;font-size:clamp(26px,7.5vw,34px);font-weight:900;color:var(--ink);letter-spacing:1px}
.sub{margin-top:10px;font-size:13px;color:var(--muted)}
.card{display:block;position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:16px;text-decoration:none;box-shadow:0 10px 28px -18px rgba(138,123,184,.6);transition:transform .15s,box-shadow .15s}
.card:active{transform:translateY(1px)}
.card .no{font-size:11px;letter-spacing:.3em;color:var(--violet);font-weight:800}
.card h2{margin:6px 0 6px;font-size:21px;color:var(--ink);font-weight:900;letter-spacing:.5px}
.card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.meta span{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--ink2);background:#fdf8fb}
.go{margin-top:16px;font-size:13px;font-weight:800;color:var(--rose)}
.speed{display:flex;gap:12px;margin-top:4px}
.speed a{flex:1;text-align:center;background:#f9f3f7;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-decoration:none;color:var(--ink2);font-size:13px;font-weight:700}
.speed a b{display:block;font-size:12px;color:var(--violet);font-weight:800;margin-bottom:2px}
.foot{margin-top:30px;text-align:center;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="kicker">QUIZ ARCHIVE · 测试合集</div>
    <h1>你比自己以为的<br>更有意思</h1>
    <div class="sub">两个测试，八种画像，测完只想说"这也太准了"</div>
  </div>

  <a class="card" href="opposite-sex-quiz.html">
    <div class="no">NO.01</div>
    <h2>测测你在异性眼里是什么样子</h2>
    <p>不问你觉得自己好看吗，而是让别人替你回答。18 个情境题，还原你在异性眼里的真实魅力画像。</p>
    <div class="meta"><span>18 道题</span><span>约 3 分钟</span><span>8 种魅力类型</span></div>
    <div class="go">开始照镜子 →</div>
  </a>

  <a class="card" href="hidden-attraction-quiz.html">
    <div class="no">NO.02</div>
    <h2>测测你隐藏的亲密吸引力类型</h2>
    <p>你需要的不是爱，而是被读懂。测你在亲密关系里真正要什么、雷区在哪、该怎么开口。</p>
    <div class="meta"><span>18 道题</span><span>约 3 分钟</span><span>8 种亲密类型</span></div>
    <div class="go">打开档案 →</div>
  </a>

  <div class="speed">
    <a href="opposite-sex-quiz-8.html"><b>速测版</b>异性眼里 · 8 题</a>
    <a href="hidden-attraction-quiz-8.html"><b>速测版</b>亲密吸引力 · 8 题</a>
  </div>

  <div class="foot">娱乐向 · 结果仅供参考，你比任何画像都更丰富</div>
</div>
</body>
</html>
